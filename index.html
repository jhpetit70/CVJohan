<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV - Johan José Petit Villarroel | Analista Programador Senior</title>
  <meta name="description" content="Curriculum Vitae de Johan José Petit Villarroel, Técnico Superior en Informática y Analista Programador especialista en Arquitectura N-Capas, Python, C# y Oracle.">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Marked.js CDN para parsear Markdown a HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- Floating Print Control (Hidden in PDF/Print) -->
  <div class="action-bar">
    <span class="pdf-notice">
      <i class="fa-solid fa-file-pdf" style="color: #ef4444;"></i> Diseñado para PDF ultra compacto en 2 páginas A4
    </span>
    <button onclick="window.print()" class="btn btn-primary">
      <i class="fa-solid fa-print"></i> Imprimir / Guardar en PDF
    </button>
  </div>

  <main class="cv-container">
    <!-- Header Hero -->
    <header class="cv-header">
      <div class="avatar-container">
        <img src="foto.jpg" alt="Foto de Perfil Johan Petit" class="avatar-img">
      </div>
      <div class="header-info">
        <h1 class="header-name">Johan José Petit Villarroel</h1>
        <div class="header-subtitle">Técnico Superior en Informática | Analista Programador Senior</div>
        <div class="quote-pill">
          <i class="fa-solid fa-quote-left"></i> Especialista en Migración Legacy, Arquitectura N-Capas y Desarrollo Acelerado con IA
        </div>
      </div>
    </header>

    <!-- Contenedor donde se cargará dinámicamente el Markdown -->
    <div id="cv-markdown-content">
      <div style="text-align: center; padding: 40px; color: #64748b;">
        <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
        <p style="margin-top: 10px;">Cargando Currículum Vitae...</p>
      </div>
    </div>
  </main>

  <script>
    // Carga dinámicamente el archivo CV-Johan-Petit.md
    fetch('CV-Johan-Petit.md')
      .then(response => {
        if (!response.ok) {
          throw new Error('No se pudo cargar el archivo Markdown');
        }
        return response.text();
      })
      .then(markdownText => {
        // Limpiamos estilos de etiquetas <style> internas si las hubiera para no sobreescribir los estilos globales
        const cleanMarkdown = markdownText.replace(/<style[\s\S]*?<\/style>/gi, '');
        
        // Parseamos el markdown a HTML
        const rawHtml = marked.parse(cleanMarkdown);
        
        // Insertamos el HTML dentro del contenedor
        const container = document.getElementById('cv-markdown-content');
        container.innerHTML = rawHtml;

        // Adaptamos las secciones o contenedores que requieren clases específicas de nuestro CSS
        // envolviendo las secciones principales si es necesario
      })
      .catch(error => {
        console.error('Error al cargar el CV:', error);
        document.getElementById('cv-markdown-content').innerHTML = `
          <div style="padding: 20px; color: #ef4444; text-align: center;">
            <p><strong>Error al cargar el contenido en Markdown.</strong></p>
            <p>Por favor verifica que el archivo <code>CV-Johan-Petit.md</code> existe en la raíz del repositorio.</p>
          </div>
        `;
      });
  </script>
</body>
</html>
